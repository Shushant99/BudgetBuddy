<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f2">
    <title>Log in | Budget Buddy</title>
    <link rel="stylesheet" href="{% static 'loginstyle.css' %}">
</head>
<body>
    <main class="login-card">
        <a class="brand" href="{% url 'home' %}">Budget Buddy</a>
        

    <form action="#" method="post">
        <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email"  required>
   </div>

     <div class="field">
                <div class="password-label">
               <label for="password">Password</label>
                    <a href="#">Forgot password?</a>        </div>
                <input id="password" name="password" type="password" autocomplete="current-password"  required>
           </div>
            <button type="submit">Log in</button>
        </form>

        <p class="signup">New to Budget Buddy? <a href="{% url 'signup' %}">create an account</a></p>
    </main>
</body>
</html>
