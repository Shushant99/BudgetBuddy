<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f2">
  <title>Budget Buddy</title>
  <link rel="stylesheet" href="{% static 'styleindex.css' %}">
</head>
<body>
  <main class="welcome-card">
    <h1>Budget Buddy</h1>
    

    <div class="actions">
      <a class="primary" href="{% url 'login' %}">Log in</a>
      <a class="secondary" href="{% url 'signup' %}">Sign up</a>
    </div>

    <div class="or-divider" aria-hidden="true">or</div>

    <button class="google" type="button">
      <span class="google-mark" aria-hidden="true">G</span>
      Continue with Google
    </button>

  </main>
</body>
</html>
