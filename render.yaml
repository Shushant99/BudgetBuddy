# Render Blueprint: describes the backend so Render can create it for you.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: budgetbuddy-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: ./build.sh
    startCommand: gunicorn Backend.wsgi:application --workers 2 --threads 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CRON_SECRET
        generateValue: true
      # Render asks you for these when you create the Blueprint (they are not stored in git):
      - key: DATABASE_URL            # postgresql://user:password@host/dbname  (Neon, or Render's own Postgres)
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # your website's address, e.g. https://budgetbuddy.vercel.app
        sync: false
      - key: APP_URL                 # the same website address (used for the links inside emails)
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false